<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب فستان بنات</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h2 {
            text-align: center;
            color: #d63384;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            border-color: #d63384;
        }
        button {
            width: 100%;
            background-color: #d63384;
            color: white;
            border: none;
            padding: 14px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #b8226c;
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>طلب فستان بنات</h2>
    <form id="orderForm">
        <div class="form-group">
            <label for="name">الاسم الكامل:</label>
            <input type="text" id="name" name="name" required placeholder="مثال: محمد علي">
        </div>

        <div class="form-group">
            <label for="phone">رقم الهاتف:</label>
            <input type="tel" id="phone" name="phone" required placeholder="06XXXXXXXX">
        </div>

        <div class="form-group">
            <label for="state">الولاية:</label>
            <input type="text" id="state" name="state" required placeholder="مثال: الجزائر">
        </div>

        <div class="form-group">
            <label for="offer">المقاس / العرض:</label>
            <select id="offer" name="offer" required>
                <option value="">اختر المقاس</option>
                <option value="مقاس 1 (سنتين - 4 سنوات)">مقاس 1 (سنتين - 4 سنوات)</option>
                <option value="مقاس 2 (6 سنوات - 8 سنوات)">مقاس 2 (6 سنوات - 8 سنوات)</option>
                <option value="مقاس 3 (10 سنوات - 12 سنة)">مقاس 3 (10 سنوات - 12 سنة)</option>
            </select>
        </div>

        <button type="submit" id="submitBtn">تأكيد الطلب</button>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const scriptURL = 'https://script.google.com/macros/s/AKfycbzQOSgtcISulNxizCQYBmFkARD7hUPEGF_C-cvEPn1f3CWo7czu45f8jxWSE2nnXOiw1Q/exec';
  const form = document.getElementById('orderForm');
  const btn = document.getElementById('submitBtn');

  if (form) {
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      btn.disabled = true;
      btn.innerText = 'جاري الإرسال...';
      
      const formData = new FormData(form);
      
      fetch(scriptURL, { 
        method: 'POST', 
        body: formData 
      })
      .then(response => {
          alert('تم إرسال طلبك بنجاح! تحقق من جدول Google Sheets الآن.');
          form.reset();
          btn.disabled = false;
          btn.innerText = 'تأكيد الطلب';
      })
      .catch(error => {
          console.error('Error!', error.message);
          alert('حدث خطأ أثناء الإرسال. تأكد من إعدادات النشر في Google Apps Script.');
          btn.disabled = false;
          btn.innerText = 'تأكيد الطلب';
      });
    });
  }
});
</script>

</body>
</html>
